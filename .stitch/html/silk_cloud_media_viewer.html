<body class="bg-background text-on-surface font-body h-full overflow-hidden flex flex-col antialiased">
<!-- Top Navigation (Silk Cloud Media Viewer Context - Intent is highly focused, navigation shell suppressed mostly, but showing minimal back/actions) -->
<header class="w-full flex justify-between items-center px-6 py-4 bg-surface shadow-[6px_6px_12px_rgba(0,0,0,0.08),-6px_-6px_12px_rgba(255,255,255,0.6)] z-10">
<button class="w-10 h-10 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface hover:scale-[1.02] transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center gap-2 text-on-surface-variant font-medium">
<span class="material-symbols-outlined text-sm" data-icon="cloud_done">cloud_done</span>
<span class="text-sm">Synced</span>
</div>
<div class="flex gap-4">
<button class="w-10 h-10 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface hover:scale-[1.02] transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col md:flex-row relative">
<!-- Image Container -->
<div class="flex-1 p-6 md:p-12 flex items-center justify-center relative overflow-hidden bg-surface-container-lowest">
<!-- Neomorphic Frame for Image -->
<div class="relative w-full max-w-5xl aspect-auto max-h-[819px] rounded-xl neo-raised p-2 bg-surface">
<div class="w-full h-full rounded-lg overflow-hidden neo-inset bg-surface-container-highest relative flex items-center justify-center">
<img class="object-contain w-full h-full rounded-lg shadow-inner z-0" data-alt="A breathtaking landscape photograph of a serene mountain lake at sunrise. The sky is a gradient of soft pastels, reflecting perfectly on the still water. Wisps of fog hug the pine trees on the shoreline. The lighting is soft, natural, and cinematic, emphasizing tranquility and vastness, perfectly suited for a high-end cloud storage media viewer." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2eLmYSZHyY6GIcoUZRKUPDL2BDrkKkg1ebtC543HxSvWGczyjjJfHONaYUkALLevgQsMF_SfncW5b_Ztka7DXdbEpQfgYO0Dg_X5WVDhMsSaG33as7RRaFP8uCfyvsuvQy7pnAj7WWWHOOrcRTsx5OlUty3rY1jewwDsFWRRd5n_4t-e0csUbvMqwziGR5a9GI51nXP4tcBgb80n8bw2Lmw-wV7DmeD4yn1kq1jkpaRQ8oMWNkCgR"/>
<!-- Decorative loading/shimmer effect behind image if it were loading -->
<div class="absolute inset-0 bg-gradient-to-tr from-surface-variant to-surface-bright opacity-20 -z-10 mix-blend-overlay"></div>
</div>
</div>
<!-- Navigation Chevrons -->
<button class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="chevron_left">chevron_left</span>
</button>
<button class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Toolbar / Info Panel (Bottom on mobile, Right side on desktop) -->
<aside class="w-full md:w-80 bg-surface flex flex-col gap-6 p-6 neo-raised md:shadow-[-6px_0_12px_rgba(0,0,0,0.05)] z-10 shrink-0">
<!-- Image Meta -->
<div class="flex flex-col gap-1 px-2">
<h2 class="text-xl font-headline font-semibold text-on-surface">Yosemite_Sunrise.jpg</h2>
<p class="text-sm text-on-surface-variant font-body">Oct 24, 2023 • 12.4 MB • 4K</p>
</div>
<!-- Action Grid -->
<div class="grid grid-cols-4 md:grid-cols-2 gap-4 mt-2">
<button class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 p-3 md:p-4 rounded-xl bg-surface neo-raised text-on-surface hover:text-primary transition-all">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
<span class="text-xs md:text-sm font-medium">Edit</span>
</button>
<button class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 p-3 md:p-4 rounded-xl bg-surface neo-raised text-on-surface hover:text-primary transition-all">
<span class="material-symbols-outlined" data-icon="share">share</span>
<span class="text-xs md:text-sm font-medium">Share</span>
</button>
<button aria-pressed="true" class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 p-3 md:p-4 rounded-xl bg-surface neo-inset text-primary transition-all">
<span class="material-symbols-outlined" data-icon="favorite" data-weight="fill" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="text-xs md:text-sm font-medium">Favorite</span>
</button>
<button class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 p-3 md:p-4 rounded-xl bg-surface neo-raised text-error hover:text-on-error-container transition-all">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
<span class="text-xs md:text-sm font-medium">Delete</span>
</button>
</div>
<!-- Details Section -->
<div class="mt-auto md:mt-6 rounded-xl bg-surface p-4 neo-inset">
<h3 class="text-sm font-semibold text-on-surface mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="info">info</span> Details
                </h3>
<div class="space-y-3 text-sm">
<div class="flex justify-between">
<span class="text-on-surface-variant">Camera</span>
<span class="text-on-surface font-medium">Sony A7R IV</span>
</div>
<div class="flex justify-between">
<span class="text-on-surface-variant">Lens</span>
<span class="text-on-surface font-medium">24-70mm f/2.8</span>
</div>
<div class="flex justify-between">
<span class="text-on-surface-variant">Settings</span>

</div>
<div class="flex justify-between items-center mt-2 pt-2 border-t border-outline-variant/30">
<span class="text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[16px]" data-icon="location_on">location_on</span> Location</span>
<span class="text-on-surface font-medium">Yosemite Valley</span>
</div>
</div>
</div>
