<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="planeGrad" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="12" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="apertureGrad" x1="24" y1="24" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield / Squircle for App Icon contrast -->
  <rect width="64" height="64" rx="16" fill="#0b1326"/>

  <!-- Telegram Plane Wing (Back/Shadow) -->
  <path d="M12 32 L52 14 L34 50 L26 38 Z" fill="#312e81" opacity="0.6"/>

  <!-- Telegram Plane Main Body (Isometric Sleek Wing) -->
  <path d="M12 32 L52 14 L38 35 L24 37 Z" fill="url(#planeGrad)" filter="url(#glow)"/>
  
  <!-- Telegram Plane Fold Wing (Bottom Fold) -->
  <path d="M24 37 L38 35 L34 50 L28 42 Z" fill="#4338ca"/>

  <!-- Gallery Photo Frame Morph (Overlaid Polaroid Media Card) -->
  <rect x="22" y="18" width="22" height="18" rx="3.5" transform="rotate(-10 33 27)" fill="url(#photoGrad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" filter="url(#glow)"/>
  
  <!-- Photo Inner Mountain / Sun Art -->
  <circle cx="36" cy="23" r="2" fill="#38bdf8"/>
  <path d="M25 32 L31 26 L36 30 L40 25 L43 30" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Aperture Center Hub / Media Ring -->
  <circle cx="33" cy="33" r="7" fill="#0b1326" stroke="url(#apertureGrad)" stroke-width="2"/>
  <circle cx="33" cy="33" r="3" fill="#38bdf8"/>
</svg>
